  "_about": "Стандартные места баз чатов AutoClaw и ZCode. Программа читает этот файл при старте и никогда не перезаписывает валидный файл. Если приложение сменит место или имя базы — просто исправьте пути здесь текстовым редактором, пересборка exe не нужна. Формат: JSON (UTF-8 с BOM), кодировка при сохранении — UTF-8.",
  "_substitutions": "В путях работают подстановки: %ПЕРЕМЕННЫЕ% окружения (например %APPDATA%), ~ — домашняя папка пользователя, * — любое имя папки на этом месте. Порядок путей не важен: берётся самая свежая база. Версия 3: paths ведут ТОЛЬКО к главному файлу базы; остальные файлы комплекта (files) — ОТНОСИТЕЛЬНО папки главного (значение — относительная папка, имя файла = ключ).",
